name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: docs links, spec index, lens placeholders
        run: node scripts/check-docs.mjs
      - name: spec lock (a spec change carries a changelog line)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-spec-lock.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-spec-lock.mjs --base HEAD~1
          fi
      - name: lint, typecheck, format, unit and golden tests
        run: npm run lint && npm run typecheck && npm run format:check && npm test
      - name: build the app
        run: npm run build
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: build
        run: npm run build
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: browser walks (desktop 1440×900 and mobile 390×844, keyboard first)
        run: npx playwright test
      - name: playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  prototype:
    name: prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: the prototype's 372 tests, build and Pages preflight (frozen reference)
        run: npm run proto:check && npm run proto:build
