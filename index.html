      <h1>WITT – GRACE-menetelmä</h1>
      <p>
        WITT on selaimessa toimiva työkalu argumenttipuille ja päätöksille: pura väite tai päätös
        perusteluiksi, arvioi jokaisen perustelun uskottavuus (0–100 %) ja vaikutus (−5…+5) ja katso, mihin
        perustelut kallistuvat. Yksin tai yhdessä: yksilöille, perheille, tiimeille, yhteisöille ja
        organisaatioille. Työkalu tarvitsee JavaScriptin; ota se käyttöön selaimessasi.
      </p>
      <p lang="en">
        WITT is a browser tool for argument trees and decisions, built on the GRACE Method: break a claim or a
        decision into reasons, rate each reason's credence (0–100 %) and influence (−5…+5), and see where the
        reasons lean. On your own or together: for individuals, families, teams, communities and
        organisations. The tool needs JavaScript; please enable it in your browser.
      </p>
    </noscript>
